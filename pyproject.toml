[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "heure-bleue"
dynamic = ["version"]
description = "A gallery wall for a spare screen: open-collection paintings matched to the music you play."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = ["pillow>=10"]

[project.optional-dependencies]
windows = ["winsdk; sys_platform == 'win32'"]
app = ["pywebview>=5", "certifi", "cryptography>=41"]   # `heurebleue app`: the wall in its own window; certifi = https from the packaged app

[project.scripts]
heurebleue = "heurebleue.__main__:main"

[tool.setuptools]
packages = ["heurebleue", "heurebleue.nowplaying"]

[tool.setuptools.dynamic]
version = { attr = "heurebleue.__version__" }
