<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title data-i18n-doc="stats">Stats · Gallery wall</title>
<style>
  :root {
    --bg: #0b1026;
    --text: #dde3f2;
    --text-rgb: 221, 227, 242;
    --muted: rgba(var(--text-rgb), 0.55);
    --faint: rgba(var(--text-rgb), 0.28);
    --gold: #f0b45c;
    --glow: rgba(240, 180, 92, 0.35);
    --hair: rgba(var(--text-rgb), 0.10);
    --serif: "Iowan Old Style", "Palatino", "Georgia", serif;
    --sans: -apple-system, "Helvetica Neue", "Inter", sans-serif;
    --u: 1vw;
  }
  @media (orientation: landscape) { :root { --u: max(0.75vh, 0.6vw, 9px); } }   /* a TV scales with its height; a laptop window never drops below readable */
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { background: var(--bg); color: var(--text); font-family: var(--sans); font-weight: 300; transition: background 3s ease, color 3s ease; }
  body { min-height: 100%; padding: 3.2vh 4vw 8vh; font-variant-numeric: tabular-nums; }
  body::before { content: ""; position: fixed; inset: 0; pointer-events: none; background: radial-gradient(60% 40% at 50% 45%, var(--glow) 0%, transparent 70%); opacity: var(--glow-opacity, 0.45); }
  a { color: inherit; text-decoration: none; }
  #top { display: grid; grid-template-columns: 1fr auto; align-items: end; padding-bottom: 2vh; border-bottom: 1px solid var(--hair); }
  #top h1 { font-family: var(--serif); font-style: italic; font-weight: 400; font-size: calc(var(--u) * 3.2); line-height: 1; }
  #top h1 small { font-family: var(--sans); font-style: normal; font-weight: 300; font-size: 0.45em; color: var(--muted); margin-left: 0.7em; }
  #links { display: flex; gap: 2.4vw; align-items: baseline; }
  #links a { font-size: calc(var(--u) * 1.5); color: var(--muted); letter-spacing: 0.04em; transition: color 0.3s ease; }
  #links a:hover, #links a:focus-visible { color: var(--gold); outline: none; }

  /* headline numbers */
  #head { display: grid; grid-template-columns: repeat(3, 1fr); gap: 3vh 3vw; padding: 3.5vh 0 3vh; border-bottom: 1px solid var(--hair); }
  @media (orientation: landscape) { #head { grid-template-columns: repeat(6, 1fr); } }
  .big .n { font-family: var(--serif); font-size: calc(var(--u) * 4.2); line-height: 1; color: var(--gold); }
  .big .n small { font-size: 0.45em; color: var(--muted); font-family: var(--sans); margin-left: 0.15em; }
  .big .k { font-size: calc(var(--u) * 1.05); color: var(--faint); letter-spacing: 0.1em; text-transform: uppercase; margin-top: 1vh; }

  /* sections */
  #grid { display: grid; grid-template-columns: 1fr; gap: 0 5vw; }
  @media (orientation: landscape) { #grid { grid-template-columns: 1fr 1fr; } }
  @media (orientation: landscape) and (min-width: 2200px) { #grid { grid-template-columns: 1fr 1fr 1fr; } }
  section { padding: 3.5vh 0 1vh; break-inside: avoid; }
  section h2 { font-family: var(--serif); font-style: italic; font-weight: 400; font-size: calc(var(--u) * 2.1); padding-bottom: 1.2vh; margin-bottom: 1.6vh; border-bottom: 1px solid var(--gold); border-image: linear-gradient(90deg, var(--gold) 0, var(--gold) 18%, transparent 18%) 1; }
  section h2 small { font-family: var(--sans); font-style: normal; font-size: 0.55em; color: var(--faint); margin-left: 0.8em; letter-spacing: 0.06em; text-transform: uppercase; }
  .row { display: grid; grid-template-columns: minmax(0, 11em) 1fr auto; align-items: center; gap: 1.6vw; padding: 0.55vh 0; font-size: calc(var(--u) * 1.3); }
  .row .k { color: var(--text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row .k .s { color: var(--faint); }
  .row .bar { height: 2px; background: var(--hair); position: relative; }
  .row .bar i { position: absolute; left: 0; top: -1px; height: 4px; background: var(--gold); width: 0; transition: width 1.2s cubic-bezier(.2,.7,.2,1); }
  .row .v { color: var(--muted); font-size: 0.9em; min-width: 4.5em; text-align: right; }
  .row img { width: calc(var(--u) * 3); height: calc(var(--u) * 3); object-fit: cover; margin-right: 0.6em; vertical-align: middle; filter: drop-shadow(0 4px 10px rgba(0,0,0,0.5)); }
  .row.pic .k { display: flex; align-items: center; white-space: normal; line-height: 1.2; }
  .row.pic .k > span { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .row.pic .k em { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .row .k em { font-family: var(--serif); font-weight: 400; }
  .row.pair { grid-template-columns: minmax(0, 18em) 1fr auto; }

  /* hours of the day */
  #hours { display: grid; grid-template-columns: repeat(24, 1fr); gap: 0.35vw; align-items: end; height: 12vh; margin-top: 1vh; }
  #hours i { display: block; background: var(--gold); opacity: 0.85; min-height: 1px; transition: height 1.2s ease; }
  #hours i.z { background: var(--hair); opacity: 1; height: 1px !important; }
  #hourlbl { display: grid; grid-template-columns: repeat(24, 1fr); font-size: calc(var(--u) * 0.9); color: var(--faint); margin-top: 0.8vh; }
  #hourlbl span:nth-child(n+2):not(:nth-child(6n+1)) { visibility: hidden; }

  #empty { display: none; font-family: var(--serif); font-style: italic; font-size: calc(var(--u) * 2.2); color: var(--muted); text-align: center; padding: 28vh 4vw; line-height: 1.5; }
  #empty.on { display: block; }
  #empty small { display: block; font-family: var(--sans); font-style: normal; font-size: 0.55em; color: var(--faint); margin-top: 1.2vh; }
  .none { color: var(--faint); font-size: calc(var(--u) * 1.2); font-style: italic; font-family: var(--serif); padding: 0.5vh 0; }
  body.snap * { transition: none !important; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
  <header id="top">
    <h1><span data-i18n="stats">Stats</span><small id="since"></small></h1>
    <nav id="links"><a href="favorites.html" data-i18n="kept">kept</a><a href="./">&larr; <span data-i18n="wall">wall</span></a></nav>
  </header>

  <div id="head"></div>
  <div id="empty"><span data-i18n="empty_stats">Nothing yet.</span><small data-i18n="empty_stats_sub">The wall writes one line each time the painting changes.</small></div>
  <main id="grid"></main>

<script src="i18n.js?v=__V__"></script>
<script>
const $ = (s) => document.querySelector(s);
const T = (k, v) => HB.t(k, v);
const esc = (s) => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

// --- themes (same as the wall) -------------------------------------------------
const THEMES = {
  "heure-bleue": { bg: "#0b1026", text: "#dde3f2", gold: "#f0b45c" }, "night": { bg: "#07070a", text: "#e8e6e1", gold: "#d8b36a" },
  "charcoal": { bg: "#1b1b1d", text: "#e6e4df", gold: "#d9a441" }, "forest": { bg: "#0e1f1c", text: "#dfe9e5", gold: "#c9a96b" },
  "plum": { bg: "#1a1020", text: "#ece3f0", gold: "#e0b070" }, "oxblood": { bg: "#24100f", text: "#f0e4dc", gold: "#e0a860" },
  "paper": { bg: "#f4ecdd", text: "#2c2315", gold: "#b45a10" }, "linen": { bg: "#e9e4da", text: "#2a2622", gold: "#9c6a10" }, "painting": null,
};
const params = new URLSearchParams(location.search);
const hexRgb = (h) => { const n = parseInt(h.replace("#", ""), 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; };
const lum = ([r, g, b]) => (0.2126 * r + 0.7152 * g + 0.0722 * b) / 255;
(function theme() {
  const name = params.get("theme") || localStorage.getItem("wall.theme") || "forest";
  const bg = params.get("bg") || localStorage.getItem("wall.bg");
  let t = THEMES[name] || THEMES.forest;
  if ((name === "custom" || params.has("bg")) && bg) { const h = bg.startsWith("#") ? bg : "#" + bg; const d = lum(hexRgb(h)) < 0.45; t = { bg: h, text: d ? "#e8e6e1" : "#2a2622", gold: d ? "#d8b36a" : "#9c6a10" }; }
  const r = document.documentElement.style;
  r.setProperty("--bg", t.bg); r.setProperty("--text", t.text); r.setProperty("--text-rgb", hexRgb(t.text).join(", ")); r.setProperty("--gold", t.gold);
  r.setProperty("--glow-opacity", lum(hexRgb(t.bg)) < 0.45 ? "0.45" : "0.18");
})();
if (params.has("snap")) document.body.classList.add("snap");

// --- helpers --------------------------------------------------------------------
const century = (date) => { const m = /(1[0-9]{3}|20[0-9]{2})/.exec(date || ""); return m ? Math.floor(+m[1] / 100) + 1 : null; };
const shortMuseum = (n) => (n || "").replace(/^The\s+/, "").replace(/,.*$/, "");
function dur(sec) { const m = Math.round(sec / 60); if (m < 60) return `${m} ${T("min")}`; const h = Math.floor(m / 60); return `${h} ${T("h")} ${String(m % 60).padStart(2, "0")}`; }
function tally(rows, keyFn, valFn = () => 1) {
  const m = new Map();
  for (const r of rows) { const k = keyFn(r); if (k == null || k === "") continue; const e = m.get(k) || { k, v: 0, n: 0, r }; e.v += valFn(r); e.n += 1; m.set(k, e); }
  return [...m.values()].sort((a, b) => b.v - a.v);
}
function rows(list, top, fmt, extra = "") {
  if (!list.length) return `<div class="none">${T("nothing_yet")}</div>`;
  const max = list[0].v || 1;
  return list.slice(0, top).map(e => `<div class="row ${extra}"><span class="k" title="${esc(e.label || e.k)}">${e.html || esc(e.label || e.k)}</span><span class="bar"><i data-w="${(100 * e.v / max).toFixed(1)}"></i></span><span class="v">${fmt(e)}</span></div>`).join("");
}
function section(title, sub, body) { return `<section><h2>${title}${sub ? `<small>${sub}</small>` : ""}</h2>${body}</section>`; }

// --- load and aggregate -------------------------------------------------------
async function load() {
  let hist = [], favs = [], index = [];
  try { hist = await (await fetch("/api/history?limit=20000", { cache: "no-store" })).json(); } catch (e) {}
  try { favs = await (await fetch("/api/favorites", { cache: "no-store" })).json(); } catch (e) {}
  try { index = await (await fetch("data/paintings.json")).json(); } catch (e) {}
  if (!Array.isArray(hist)) hist = []; if (!Array.isArray(favs)) favs = []; if (!Array.isArray(index)) index = [];
  const byId = new Map(index.map(p => [p.id, p]));
  hist = hist.filter(r => r && r.id && r.dwell_s != null).map(r => ({ ...r, p: byId.get(r.id) || {} }));

  if (!hist.length && !favs.length) { $("#empty").classList.add("on"); return; }
  const first = hist.length ? new Date(Math.min(...hist.map(r => r.ts * 1000)) ) : null;
  $("#since").textContent = first ? T("since", { d: first.toLocaleDateString(HB.dateLocale(), { day: "numeric", month: "long" }) }) : "";

  const total = hist.reduce((a, r) => a + (r.dwell_s || 0), 0);
  const music = hist.filter(r => r.mode === "music");
  const skipped = hist.filter(r => r.swapped);
  const dwellAvg = hist.length ? total / hist.length : 0;
  const head = [
    [hist.length, "", T("shown")], [new Set(hist.map(r => r.id)).size, "", T("works")],
    [total >= 3600 ? (total / 3600).toFixed(1) : Math.round(total / 60), total >= 3600 ? T("h") : T("min"), T("on_wall")],
    [favs.length, "", T("kept").toLowerCase()], [hist.length ? Math.round(100 * skipped.length / hist.length) : 0, "%", T("skipped")],
    [hist.length ? Math.round(100 * music.length / hist.length) : 0, "%", T("with_music")],
  ];
  $("#head").innerHTML = head.map(([n, u, k]) => `<div class="big"><div class="n">${n}${u ? `<small>${u}</small>` : ""}</div><div class="k">${k}</div></div>`).join("");

  const secs = [];
  const time = (e) => dur(e.v);
  const count = (e) => `${e.n}×`;

  secs.push(section(T("museums"), T("time_on_wall"), rows(tally(hist, r => r.museum, r => r.dwell_s).map(e => ({ ...e, label: shortMuseum(e.k) })), 6, time)));
  secs.push(section(T("centuries"), T("time_on_wall"), rows(tally(hist, r => century(r.p.date), r => r.dwell_s).map(e => ({ ...e, label: HB.century(e.k) })), 8, time)));
  secs.push(section(T("painters"), T("most_on_wall"), rows(tally(hist.filter(r => r.artist && r.artist !== "Unknown artist"), r => r.artist, r => r.dwell_s), 8, time)));
  const pics = tally(hist, r => r.id, r => r.dwell_s).map(e => ({ ...e, html: `${e.r.p.image ? `<img src="${esc(e.r.p.image)}" alt="">` : ""}<span><em>${esc(e.r.title)}</em><br><span class="s">${esc(e.r.artist || "")}</span></span>` }));
  secs.push(section(T("most_shown"), "", rows(pics, 5, (e) => `${e.n}× · ${dur(e.v)}`, "pic")));
  const skips = tally(skipped, r => r.id).map(e => ({ ...e, html: `${e.r.p.image ? `<img src="${esc(e.r.p.image)}" alt="">` : ""}<span><em>${esc(e.r.title)}</em><br><span class="s">${esc(e.r.artist || "")}</span></span>` }));
  secs.push(section(T("sec_skipped"), T("skipped_sub"), rows(skips, 5, count, "pic")));

  secs.push(section(T("music"), T("music_sub"), rows(tally(music.filter(r => r.track_artist), r => r.track_artist, r => r.dwell_s), 8, time)));
  secs.push(section(T("songs"), "", rows(tally(music.filter(r => r.track), r => `${r.track}|${r.track_artist}`, r => r.dwell_s).map(e => ({ ...e, html: `${esc(e.r.track)} <span class="s">· ${esc(e.r.track_artist || "")}</span>` })), 8, time)));
  // pairings: for each music artist, the painter matched most often
  const pairs = [];
  for (const a of tally(music.filter(r => r.track_artist && r.artist), r => r.track_artist).slice(0, 12)) {
    const top = tally(music.filter(r => r.track_artist === a.k && r.artist), r => r.artist)[0];
    if (top) pairs.push({ k: a.k, v: top.n, n: a.n, label: `${a.k} → ${top.k}`, html: `${esc(a.k)} <span class="s">→</span> ${esc(top.k)}` });
  }
  secs.push(section(T("pairings"), T("pairings_sub"), rows(pairs.sort((a, b) => b.v - a.v), 6, (e) => T("of", { a: e.v, b: e.n }), "pair")));

  const keptMuseum = tally(favs, f => f.museum).map(e => ({ ...e, label: shortMuseum(e.k) }));
  secs.push(section(T("kept"), T("by_museum"), rows(keptMuseum, 6, count)));
  const keptSongs = tally(favs.filter(f => f.track && f.track.title), f => `${f.track.title}|${f.track.artist}`).map(e => ({ ...e, html: `${e.r.track.cover ? `<img src="${esc(e.r.track.cover)}" alt="">` : ""}<span>${esc(e.r.track.title)}<br><span class="s">${esc(e.r.track.artist || "")}</span></span>` }));
  secs.push(section(T("songs_hearts"), "", rows(keptSongs, 6, count, "pic")));

  // hours of the day
  const hours = new Array(24).fill(0);
  for (const r of hist) hours[new Date(r.ts * 1000).getHours()] += r.dwell_s || 0;
  const hmax = Math.max(...hours, 1);
  secs.push(section(T("hours"), T("hours_sub"), `<div id="hours">${hours.map(h => `<i class="${h ? "" : "z"}" data-h="${(100 * h / hmax).toFixed(1)}"></i>`).join("")}</div><div id="hourlbl">${hours.map((_, i) => `<span>${String(i).padStart(2, "0")}</span>`).join("")}</div>`));

  $("#grid").innerHTML = secs.join("");
  requestAnimationFrame(() => {
    document.querySelectorAll(".bar i").forEach(i => i.style.width = i.dataset.w + "%");
    document.querySelectorAll("#hours i:not(.z)").forEach(i => i.style.height = Math.max(2, i.dataset.h) + "%");
  });
}
document.addEventListener("keydown", (e) => { if (!e.metaKey && !e.ctrlKey && !e.altKey && e.key === "Escape") location.href = "./"; });
HB.init().then(load);
document.addEventListener("hb:lang", () => load());
</script>
</body>
</html>
