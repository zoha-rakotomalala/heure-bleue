name: check
on: [push, pull_request]
jobs:
  check:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "${{ matrix.python }}" }
      - run: python -m pip install -r requirements.txt
      - run: python -m compileall -q heurebleue
      - run: python tests/test_signals.py
      - run: python -m heurebleue doctor || true
      - run: python -c "import json;d=json.load(open('data/paintings.json',encoding='utf-8'));assert len(d)>0 and all({'id','title','image','palette'}<=set(p) for p in d);print(len(d),'paintings')"
      - run: python -m heurebleue demo --out site
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - run: node tests/test_demo_shim.js web/demo.js
      - run: node tests/test_i18n.js web/i18n.js
      - run: node tests/test_keys.js web
